# Docker 版 Nginx 站点配置（由 conf.d 引入，位于 http 块内）
# 与 nginx-1.28.0/conf/nginx.conf 语义一致，差异：
#  1) upstream 指向 compose 服务名 backend
#  2) 静态根目录改为镜像内 /usr/share/nginx/html
#  3) /uploads/ 代理到 /api/uploads/（后端 context-path=/api，原直通路径不通）
#  4) 移除遗留 /ai/ 与 ai_cluster（仓库内无 FastAPI 服务，AI 已集成在 Spring Boot）

upstream backend_cluster {
    least_conn;
    server backend:8080 max_fails=3 fail_timeout=30s weight=5;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/photo_cache levels=1:2 keys_zone=PHOTO_CACHE:100m
                 max_size=10g inactive=30d use_temp_path=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Gzip
gzip  on;
gzip_min_length 1k;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript
           image/svg+xml text/xml application/xml application/xml+rss
           text/javascript;
gzip_vary on;
gzip_proxied any;
gzip_disable "msie6";

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;

    access_log /var/log/nginx/access.log main;

    # 静态资源缓存（chunk 带 hash，immutable 永久缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri $uri/ /index.html;
    }

    # SPA 路由
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SSE 通知推送（长连接）
    location /api/notifications/subscribe {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # AI 流式聊天（SSE，必须禁用缓冲）
    location = /api/ai/chat/stream {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 本地存储静态文件（file.storage=local 时使用）
    location /uploads/ {
        proxy_pass http://backend_cluster/api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache PHOTO_CACHE;
        proxy_cache_valid 200 7d;
        proxy_cache_key "$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 200M;
        client_body_buffer_size 128k;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        # 带 Authorization 的请求绕开缓存：缓存键不含鉴权信息，否则不同用户会互相命中
        proxy_cache_bypass $http_authorization;
        proxy_no_cache $http_authorization;
        proxy_cache PHOTO_CACHE;
        proxy_cache_valid 200 7d;
        proxy_cache_key "$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # WebSocket（聊天 / 导出进度推送）
    location /ws/ {
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
