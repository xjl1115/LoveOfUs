#user  nobody;
worker_processes  auto;

error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      '$upstream_addr $upstream_response_time';

    access_log  logs/access.log  main;

    # 基础优化
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    client_max_body_size 200M;
    client_body_buffer_size 128k;

    # Gzip 压缩
    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml text/xml application/xml application/xml+rss
               text/javascript;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";

    # 静态资源缓存
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 根据客户端 Upgrade 头动态设置 Connection 头
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 后端 Spring Boot 集群
    upstream backend_cluster {
        least_conn;
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s weight=5;
        # 可扩展更多后端节点
        # server 127.0.0.1:8081 max_fails=3 fail_timeout=30s weight=5;
        # server 127.0.0.1:8082 max_fails=3 fail_timeout=30s weight=5;
        keepalive 32;
    }

    # AI 层 FastAPI 集群
    upstream ai_cluster {
        least_conn;
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        # 可扩展更多AI节点
        # server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # 前端站点集群
    upstream frontend_cluster {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        # 可扩展更多前端节点
        # server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    }

    # 图片缓存配置
    proxy_cache_path temp/photo_cache levels=1:2 keys_zone=PHOTO_CACHE:100m
                     max_size=10g inactive=30d use_temp_path=off;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态文件
        root   html;
        index  index.html index.htm;

        # 静态资源缓存
        # 说明：chunk 文件名带 hash（hash 变化即文件被替换），命中后走 immutable 永久缓存。
        #      若浏览器仍持有旧 index 引用了已删除的旧 hash chunk，则回退到 index.html
        #      让 SPA 重新加载（避免白屏 + 让浏览器拉取最新的 index 引用关系）。
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri $uri/ /index.html;
        }

        # SPA 路由 - 所有非文件请求返回 index.html
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # SSE 消息推送（长连接，需要特殊配置）
        location /api/notifications/subscribe {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 禁用缓冲（SSE 必须）
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            
            # 长连接超时（30分钟）
            proxy_connect_timeout 60s;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # API 反向代理到 Spring Boot 集群
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 仅在客户端发起升级时才传递 Upgrade/Connection
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            # 大文件上传支持
            client_max_body_size 200M;
            client_body_buffer_size 128k;
            proxy_request_buffering on;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # 图片资源缓存
            proxy_cache PHOTO_CACHE;
            proxy_cache_valid 200 7d;
            proxy_cache_key "$host$request_uri";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # AI 层代理
        location /ai/ {
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass http://ai_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # 代理 WebSocket（用于导出进度推送）
        location /ws/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # 错误页面
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }

    # HTTPS server (可选，生产环境建议启用)
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;
    #
    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;
    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;
    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;
    #
    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}
}
