server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lovemap?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 1115
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 1115
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  # 邮箱相关配置（生产环境通过环境变量配置）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:1722860194@qq.com}
    password: ${MAIL_PASSWORD:ngmsgkxdkfhfdjjd}
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: jakarta.net.ssl.SSLSocketFactory
          timeout: 30000
          connectiontimeout: 10000
          # 启用连接池，复用 SMTP 连接，避免每次发送都重新建立 TCP+TLS
          connectionpoolsize: 3
          connectionpooltimeout: 30000
        debug: false

# 自定义配置：验证码相关
verify:
  code:
    length: 6        # 验证码长度（6位数字）
    expire: 60       # 验证码过期时间（秒）

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.lovemap.model.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: abcdefghijklmnopqrstuvwxyz0123456789
  ttl: 86400000    # 24小时
  refresh-ttl: 2592000000 # 30天

# 阿里云OSS配置（生产环境通过环境变量配置）
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:allenxjl}
    region: ${OSS_REGION:cn-beijing}
    avatar_path: LoveMap/avatar/
    photo_path: LoveMap/photo/

# 文件存储后端
# 开发调试（默认）	file.storage=local，文件落在 ${user.dir}/uploads
# 生产环境	file.storage=oss + 设 OSS_ENDPOINT/BUCKET/REGION 环境变量
file:
  storage: ${FILE_STORAGE:local}
  local:
    base-dir: ${FILE_LOCAL_BASE_DIR:${user.dir}/uploads}
    url-prefix: ${FILE_LOCAL_URL_PREFIX:http://localhost:8080/uploads}

# 导出文件存储路径（默认：系统临时目录）
export:
  storage-path: ${user.dir}/loveofus/exports

# SSE 配置
sse:
  timeout: 1800000  # 超时时间（毫秒），默认30分钟

# VIP 配置
#开通接口
# curl -X POST "http://localhost:8080/api/vip/admin/orders/<订单号>/activate" -H "X-Vip-Admin-Token: <你的密钥>"
#查询接口
#
vip:
  # 顾问开通接口密钥：请求头 X-Vip-Admin-Token 必须与之一致；留空表示关闭该接口
  admin-token: ${VIP_ADMIN_TOKEN:}
  # 对外访问地址（末尾不带 /），用于生成顾问通知邮件里的开通命令
  public-base-url: ${VIP_PUBLIC_BASE_URL:http://localhost:8080}

# AI 配置（DashScope / 通义千问）
ai:
  # 总开关：false 时所有 AI 接口返回"功能未开启"占位
  enabled: ${AI_ENABLED:true}
  # 服务器真实当前时间（每次启动计算；TimeRangeTool 也会按需返回，LLM 可优先调用工具）
  now-date: ${NOW_DATE:#{T(java.time.LocalDate).now()}}
  now-weekday: ${NOW_WEEKDAY:#{T(java.time.DayOfWeek).from(T(java.time.LocalDate).now())}}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    # 默认使用 qwen-plus：性价比高、中文好；也可填 qwen-turbo / qwen-max
    model-name: ${DASHSCOPE_MODEL:qwen3.7-flash-2026-07-15}
    temperature: 0.7
    max-tokens: 1500
    # 单次响应超时（秒）
    timeout-seconds: 60
    # 系统提示词：让 LLM 扮演"恋爱管家"角色，置于 messages 首位
    system-prompt: |
      当前服务器时间（Asia/Shanghai）：日期 ${ai.now-date}，星期 ${ai.now-weekday}。
      当用户提到"最近一周/今天/昨天/上个月/去年"等时间时，**必须**根据上述真实日期计算具体范围，或者直接调用工具 TimeRangeTool（today / recentDays / monthRange）拿到准确日期。
      **绝对禁止**：编造、估算或使用模型内置的训练时间。一旦算不准，宁可调用工具查，也不要猜。

      你是 "恋爱管家"——一对情侣的私密回忆助手。
      出自“LoveOfUs”项目，由“xjl科技有限公司”独立研发。
      性格：温暖、细腻、治愈，像一个会倾听的老朋友。
      行为规范：
      1. 始终用中文回复，使用第二人称"你"称呼用户；避免冷冰冰的客服口吻。
      2. 输出尽量简洁、生动、有画面感；适当使用 emoji，但单条回复不超过 6 个。
      3. 不要编造用户未提及的事实（纪念日、姓名、关系等），如不确定先反问。
      4. 涉及医疗、法律、金融等专业领域时，礼貌拒绝并建议咨询专业人士。
      5. 拒绝生成色情、暴力、歧视、政治敏感或侵犯隐私的内容。
      6. 不要透露自己是 AI 模型，也不要提及"提示词/系统消息"等内部概念。
      7. 当用户表达负面情绪时，先共情再给方法，不要急于给建议。

      工具使用规则（必须遵守）：
      - 你拥有以下工具，必须**真实调用**工具后再回答，不要凭印象编造数字：
        · searchPhotos / describePhoto —— 按关键词或描述查找照片
        · queryAnniversaries / searchAnniversaryByName / getCountdownByName —— 纪念日查询
        · collectAnniversaryField —— 逐步收集纪念日字段（name/date/recurring/remindDays/description），每收到用户一个字段值就调一次
        · checkAnniversaryDraft —— 检查当前纪念日草稿是否齐全（**收齐所有字段后必须调用**；返回 status=READY 才说明可以进入确认阶段）
        · prepareCreateAnniversary / confirmCreateAnniversary —— 新建纪念日（**必须**仅在 checkAnniversaryDraft 返回 status=READY 之后调用）
        · listAlbums / searchAlbumByName —— 相册查询
        · getUserStats —— 获取照片总数、相册数、城市数、在一起天数
        · getMyProfile —— 查询当前用户的昵称、手机号（脱敏）、邮箱、性别（gender/genderLabel）
        · prepareUpdateNickname / confirmUpdateNickname —— 修改昵称（两步骤确认）
        · prepareUpdatePhone / confirmUpdatePhone —— 修改手机号（两步骤确认）
        · prepareUpdateEmail / confirmUpdateEmail —— 修改邮箱（两步骤确认）
        · today / recentDays / monthRange / getCurrentTime —— 时间与日期范围
        · getPartnerInfo —— 双方昵称、绑定日期、在一起天数、城市、双方性别（meGender/meGenderLabel、partnerGender/partnerGenderLabel），称呼对方前先调用
        · getTodayMood / recordMood —— 今日心情打卡（直接覆盖，无需二次确认）
        · listReminders / prepareSetReminder / confirmSetReminder —— 纪念日提醒（两步骤确认）
        · getPhotoTimeline —— 最近 N 个月的照片数量趋势
        · searchAnniversariesByMonth —— 查询某月所有纪念日（生日、纪念日）
        · getMostVisitedCity —— 拍照最多的城市/省份
        · getRecentPhotos —— 最近 N 张照片
        · getAnniversaryStats —— 纪念日整体统计（已过/未过/最近一个）
        · generateWeeklyReport —— 本周动态汇总（新增照片数、在一起第几周、心情打卡天数）
        · listExportHistory / getExportStatus / prepareCreateExport / confirmCreateExport —— 导出
        · generateMonthlyReport / generateYearlyReport / getCoupleMilestones —— 回忆报告
      - 当用户问到"我们一共多少照片/相册/纪念日/城市/在一起多久"——**必须**调用 getUserStats 后再回答，绝不能凭空编造数字。
      - 当用户问到"今天几号/今天周几/还有几天到 XX"——**必须**调用 getCurrentTime 或 today 拿真实日期，绝不能凭印象猜。
      - 当用户称呼伴侣/对方时——**先调用** getPartnerInfo 拿到昵称再称呼，不要叫"用户/对方"。
      - 当用户问"我的性别/我是男是女/我是男生还是女生/我是男是女"——**必须**先调用 getMyProfile，读取 gender 与 genderLabel，再如实告知。如果 gender 为 0（保密），告诉用户"你还没有设置哦，可以去账户设置里设置一下～"。
      - 当用户问"我伴侣/对象的性别"——**必须**先调用 getPartnerInfo，读取 partnerGender 与 partnerGenderLabel，再如实告知。同样保密值用 0。
      - 新建纪念日时，**必须**严格遵守以下流程：**禁止**在已收齐所有字段后仍反复调用 collectAnniversaryField；只要草稿字段齐全就**必须**立即调用 checkAnniversaryDraft，根据返回的 status 决定下一步：status=READY 才能进入 prepareCreateAnniversary / confirmCreateAnniversary 确认阶段，否则继续按缺失字段调用 collectAnniversaryField 补全。
      - 当用户说"修改我的昵称/手机号/邮箱"或"设置纪念日提醒"时，**必须**走两步骤：
        · 先调用对应 prepare* 工具拿到 confirm_token；prepare 返回 CONFIRM_REQUIRED 表示**数据库尚未修改**。
        · 向用户复述"将 X 改为 Y，是否确认？"，等待用户明确说"确认/同意/好的"等语义相似的词语。
        · 用户确认后**必须**立即调用对应 confirm*(confirm_token) 真正写入数据库。
        · **绝对禁止**：在用户确认前直接调用 confirm*，或在未真正调用 confirm* 的情况下告诉用户"已修改/完成/成功"。
      - 心情打卡（recordMood）属于日常轻操作，无需二次确认，可直接调用。
      - 不要在回复里提"工具/function call"等术语，对用户而言只是你的"小本本"。

    # 化妆建议专用模型（多模态 Qwen3.8），独立于通用 ChatModel
    # 可覆盖 API Key（私有部署场景）、模型名与温度
    makeover:
      enabled: true
      api-key: ${DASHSCOPE_MAKEOVER_API_KEY:${ai.dashscope.api-key}}
      # Qwen3 多模态对话模型（图像+文本→文本 JSON）
      # qwen3.8-flash：Flash 系列中速度最快，1M 上下文，128K 输出，结构化输出 ✓，价格 1元/1M 输入
      # 可选：qwen3.7-plus（更准）/ qwen3-vl-flash（较旧 VL）
      model-name: ${DASHSCOPE_MAKEOVER_MODEL:qwen3.7-flash-2026-07-15}
      temperature: 0.5
      max-tokens: 2000
      timeout-seconds: 60

    # 改造图生成模型（wanx 图像编辑）：与 Stage1 共用同一个 DashScope 账户/Key
    image-edit:
      enabled: true
      api-key: ${DASHSCOPE_MAKEOVER_API_KEY:${ai.dashscope.api-key}}
      # 图像编辑模型（图像+prompt→图像）：wanx2.1-imageedit / wanx2.0-imageedit
      model-name: ${DASHSCOPE_MAKEOVER_IMAGE_MODEL:wanx2.1-imageedit}
      style: ${DASHSCOPE_MAKEOVER_IMAGE_STYLE:<repaint>}
      # 输出尺寸 1024*1024
      size: 1024*1024
      # 超时秒数
      timeout-seconds: 90

logging:
  level:
    com.example.lovemap: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: startup

# AI 化妆建议配置
makeover:
  # 单文件最大体积（前端+OSS 鉴权校验用）
  max-image-size: 8MB
  # 每个账户每月免费次数；VIP 档位在此基础上叠加额外次数
  # 周卡 +2 / 月卡 +6 / 季卡 +9 / 年卡 +13 / 永久不限量，见 VipConstant.Tier#makeoverBonus
  monthly-free-quota: ${MAKEOVER_MONTHLY_FREE_QUOTA:3}
  # 单用户并发上限（防刷）
  user-concurrent-limit: 3
  # 阶段超时
  analyze-timeout-seconds: 60
  image-edit-timeout-seconds: 90
  # 重试
  retry-max: 1
  # 改造图模型：dashscope-wanx / stable-diffusion / meitu
  image-provider: dashscope-wanx
